<?xml version="1.0" encoding="UTF-8"?>
<!--
  identity-ldap plugin tile — generic LDAP/Active Directory brand-neutral
  icon. A stylized directory tree (filled square root, line branches, and
  child leaves) representing an LDAP hierarchy. Brand-neutral so the host
  renders the same tile for OpenLDAP, AD, 389 DS, etc.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="800" height="800" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="9" y="2" width="6" height="5" rx="1" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" />
  <line x1="4" y1="14" x2="20" y2="14" stroke="#0d9488" />
  <line x1="12" y1="7" x2="12" y2="14" stroke="#0d9488" />
  <circle cx="4" cy="17" r="1.6" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" />
  <circle cx="12" cy="17" r="1.6" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" />
  <circle cx="20" cy="17" r="1.6" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" />
  <line x1="4" y1="14" x2="4" y2="15.4" stroke="#0d9488" />
  <line x1="20" y1="14" x2="20" y2="15.4" stroke="#0d9488" />
  <line x1="4" y1="19" x2="4" y2="22" stroke="#0d9488" />
  <line x1="12" y1="19" x2="12" y2="22" stroke="#0d9488" />
  <line x1="20" y1="19" x2="20" y2="22" stroke="#0d9488" />
</svg>